# Builds and publishes a Star Storyteller release.
#
# Cutting a release is one step: push a `v<major>.<minor>.<patch>` tag. This workflow derives the
# app's versionName and versionCode from that tag, builds the APKs, and publishes them on the
# repository's Releases page.
#
# It can also be run by hand from the Actions tab with a version number, in which case it creates
# the tag for you.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    # Shared with keep-signing-key.yml so an empty cache cannot be filled twice at once. A push
    # to main starts the test build and can start a release a minute later; with both minting
    # their own key against one cache name, one save wins and the other ships an APK signed with
    # a key that exists nowhere afterwards. That is how v0.3.1 and the test build before it came
    # to differ. At job level, because prerelease.yml already has its own workflow-level group.
    concurrency:
      group: star-signing-key
      cancel-in-progress: false
    env:
      # Lifted to the job so steps can branch on whether signing is configured; the `secrets`
      # context is not available in a step's `if:` condition, but `env` is.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      # Must match prerelease.yml exactly, or a release and the test builds around it are signed
      # with different keys and cannot replace one another.
      CI_KEYSTORE_PASSWORD: star-storyteller-ci
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # versionCode has to increase monotonically, so pack the three parts of the semantic
          # version into one integer. Any pre-release suffix is dropped, since it is not part of
          # the ordering Android understands.
          core="${version%%-*}"
          # Match the whole thing rather than picking out three fields. Reading the fields
          # individually accepted a fourth: '0.2.1.5' parsed as 0.2.1 with the '.5' discarded, and
          # got the versionCode of 0.2.1 - so it could not be installed as an upgrade over it, and
          # a later 0.2.1.6 would have collided with both.
          if ! [[ "$core" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH version (three numbers, e.g. 0.2.2)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::'$version' overflows the versionCode packing; minor and patch must stay under 100"
            exit 1
          fi
          # The low four digits are a build number, and a numbered release takes the highest one so
          # it always outranks the test builds prerelease.yml published on the way to it:
          #   0.2.3-dev.7 -> 2030007,  0.2.3 -> 2039999,  0.2.4-dev.1 -> 2040001
          code=$(( ( major * 10000 + minor * 100 + patch ) * 10000 + 9999 ))

          {
            echo "name=$version"
            echo "code=$code"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (versionCode $code)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/src/**/*.gradle.kts', 'Android/src/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The same signing arrangement as prerelease.yml, and it has to be the same key: a numbered
      # release that will not install over the test build it came from is useless.
      #
      # Both used to rely on AGP's debug key with ~/.android/debug.keystore cached. That never
      # saved - the cache path did not exist when the post-job step ran - so every build got a
      # fresh key and none of them would install over another. The key is now created at a path
      # this workflow owns and handed to Gradle explicitly.
      - name: Restore the CI signing key
        id: signing-cache
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        uses: actions/cache/restore@v4
        with:
          path: ci-keystore
          key: star-ci-signing-key-v2

      - name: Create the CI signing key
        if: ${{ env.KEYSTORE_BASE64 == '' && steps.signing-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p ci-keystore
          keytool -genkeypair -v \
            -keystore ci-keystore/star-ci.jks -storetype PKCS12 -alias star \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$CI_KEYSTORE_PASSWORD" -keypass "$CI_KEYSTORE_PASSWORD" \
            -dname "CN=Star Storyteller Test Builds, OU=CI, O=Star Storyteller"

      - name: Save the CI signing key
        if: ${{ env.KEYSTORE_BASE64 == '' && steps.signing-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ci-keystore
          key: star-ci-signing-key-v2

      - name: Install Android SDK platform 37
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Work out which key to sign with
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            path="$RUNNER_TEMP/upload.jks"
            password="${{ secrets.KEYSTORE_PASSWORD }}"
            alias="${{ secrets.KEY_ALIAS }}"
            key_password="${{ secrets.KEY_PASSWORD }}"
          else
            path="$GITHUB_WORKSPACE/ci-keystore/star-ci.jks"
            password="$CI_KEYSTORE_PASSWORD"
            alias=star
            key_password="$CI_KEYSTORE_PASSWORD"
          fi

          # The certificate this build will be signed with, read from the keystore itself.
          #
          # Not from the APK. The first attempt used `keytool -printcert -jarfile`, which reports
          # nothing for a v2/v3-only APK, and minSdk 31 means there is no v1 signature to read -
          # it would have printed an empty fingerprint and looked fine. The second used apksigner
          # and failed on the runner, because it depended on finding a binary somewhere in the
          # SDK, which is the same kind of assumption that broke signing in the first place.
          #
          # This keystore is created by this workflow, so it is certainly here, and its
          # certificate is exactly the one that ends up in the APK - verified by building an APK
          # and comparing the two.
          fingerprint="$(keytool -list -v -keystore "$path" -alias "$alias" \
            -storepass "$password" 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-Z' 'a-z' || true)"
          if [ -z "$fingerprint" ]; then
            echo "::error::Could not read the signing certificate out of $path"
            exit 1
          fi
          echo "Signing with SHA-256 $fingerprint"

          {
            echo "path=$path"
            echo "password=$password"
            echo "alias=$alias"
            echo "key_password=$key_password"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"
      - name: Run the unit tests
        working-directory: ./Android/src
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build the release APKs
        working-directory: ./Android/src
        env:
          STAR_VERSION_NAME: ${{ steps.version.outputs.name }}
          STAR_VERSION_CODE: ${{ steps.version.outputs.code }}
          STAR_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STAR_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.password }}
          STAR_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          STAR_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect and rename the APKs
        id: apks
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for apk in Android/src/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"
            # app-arm64-v8a-release -> arm64-v8a, app-universal-release -> universal
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/star-storyteller-${VERSION}-${abi}.apk"
          done
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No APKs were produced"
            exit 1
          fi
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
          ls -lh dist

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.apks.outputs.signed }}
          FINGERPRINT: ${{ steps.keystore.outputs.fingerprint }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"

          # Assets live under a predictable URL, so the notes can link straight to them. Listing
          # bare filenames instead is what made the GitHub mobile app look broken: it renders the
          # notes but keeps the Assets section behind "View release details", so the table read
          # as a list of downloads that could not be tapped.
          base="https://github.com/${REPO}/releases/download/${TAG}"
          size_of() {
            # Human-readable size of a built APK, so the table says what a tap will cost.
            local file="dist/star-storyteller-${VERSION}-$1.apk"
            if [ -f "$file" ]; then
              echo "$(( ( $(stat -c%s "$file") + 524288 ) / 1048576 )) MB"
            else
              echo "-"
            fi
          }
          link() { echo "[star-storyteller-${VERSION}-$1.apk](${base}/star-storyteller-${VERSION}-$1.apk)"; }

          {
            echo "## Install"
            echo
            echo "Tap the APK that matches your phone. Almost every Android phone made since 2018"
            echo "is **arm64-v8a**; take the universal APK if you are not sure."
            echo
            echo "| Download | Size | For |"
            echo "| --- | --- | --- |"
            echo "| $(link arm64-v8a) | $(size_of arm64-v8a) | Nearly all modern phones |"
            echo "| $(link universal) | $(size_of universal) | Any phone, larger download |"
            echo "| $(link armeabi-v7a) | $(size_of armeabi-v7a) | Older 32-bit phones |"
            echo "| $(link x86_64) | $(size_of x86_64) | Emulators and x86 tablets |"
            echo
            echo "Android will warn that the app comes from an unknown source; allow installs from"
            echo "your browser or file manager to continue. Checksums:"
            echo "[SHA256SUMS.txt](${base}/SHA256SUMS.txt)."
            echo
            echo "_This repository is private, so the links above need you signed in to GitHub."
            echo "If one does not open, the same files are under **Assets** at the bottom of this"
            echo "release — on the GitHub mobile app, tap **View release details** first._"
            echo
            echo "Signing key: \`${FINGERPRINT}\`."
            if [ "$SIGNED" != "true" ]; then
              echo "This is a CI test key, kept in the Actions cache."
            fi
            echo
            echo "Android will not install over a copy signed with a different key. If the install"
            echo "is refused with \`App not installed\`, uninstall the old version first."
            echo
            echo "## Set it as your assistant"
            echo
            echo "Settings → Apps → Default apps → Digital assistant app → Star Storyteller."
            echo "Then open the app, pick a model from the chip at the top of the chat, and let it"
            echo "download. Web search needs your own SearXNG instance — see the README."
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              echo "Since \`${previous}\`:"
              echo
              git log --no-merges --pretty='- %s' "${previous}..HEAD"
            else
              echo "First release."
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Tag the commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Star Storyteller $TAG"
          git push origin "$TAG"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Star Storyteller ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.version.outputs.name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
