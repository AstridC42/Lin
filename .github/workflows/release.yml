# Builds and publishes a Star Storyteller release.
#
# Cutting a release is one step: push a `v<major>.<minor>.<patch>` tag. This workflow derives the
# app's versionName and versionCode from that tag, builds the APKs, and publishes them on the
# repository's Releases page.
#
# It can also be run by hand from the Actions tab with a version number, in which case it creates
# the tag for you.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      # Lifted to the job so steps can branch on whether signing is configured; the `secrets`
      # context is not available in a step's `if:` condition, but `env` is.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # versionCode has to increase monotonically, so pack the three parts of the semantic
          # version into one integer. Any pre-release suffix is dropped, since it is not part of
          # the ordering Android understands.
          core="${version%%-*}"
          # Match the whole thing rather than picking out three fields. Reading the fields
          # individually accepted a fourth: '0.2.1.5' parsed as 0.2.1 with the '.5' discarded, and
          # got the versionCode of 0.2.1 - so it could not be installed as an upgrade over it, and
          # a later 0.2.1.6 would have collided with both.
          if ! [[ "$core" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH version (three numbers, e.g. 0.2.2)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::'$version' overflows the versionCode packing; minor and patch must stay under 100"
            exit 1
          fi
          # The low four digits are a build number, and a numbered release takes the highest one so
          # it always outranks the test builds prerelease.yml published on the way to it:
          #   0.2.3-dev.7 -> 2030007,  0.2.3 -> 2039999,  0.2.4-dev.1 -> 2040001
          code=$(( ( major * 10000 + minor * 100 + patch ) * 10000 + 9999 ))

          {
            echo "name=$version"
            echo "code=$code"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (versionCode $code)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/src/**/*.gradle.kts', 'Android/src/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Shared with prerelease.yml, and for the same reason: without signing secrets the build
      # falls back to the debug key, which Gradle generates fresh on any machine that does not
      # already have one. Caching it keeps a single key across every build, numbered release and
      # test build alike, so they install over each other instead of demanding an uninstall.
      - name: Cache the debug signing key
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install Android SDK platform 37
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      # Signing is optional. With the four secrets set, releases are signed with your upload key
      # and users can upgrade in place. Without them the build falls back to the debug key, which
      # still installs but cannot be upgraded over a differently signed build.
      - name: Decode the upload keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Run the unit tests
        working-directory: ./Android/src
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build the release APKs
        working-directory: ./Android/src
        env:
          STAR_VERSION_NAME: ${{ steps.version.outputs.name }}
          STAR_VERSION_CODE: ${{ steps.version.outputs.code }}
          STAR_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect and rename the APKs
        id: apks
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for apk in Android/src/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"
            # app-arm64-v8a-release -> arm64-v8a, app-universal-release -> universal
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/star-storyteller-${VERSION}-${abi}.apk"
          done
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No APKs were produced"
            exit 1
          fi
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
          ls -lh dist
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.apks.outputs.signed }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"

          # Assets live under a predictable URL, so the notes can link straight to them. Listing
          # bare filenames instead is what made the GitHub mobile app look broken: it renders the
          # notes but keeps the Assets section behind "View release details", so the table read
          # as a list of downloads that could not be tapped.
          base="https://github.com/${REPO}/releases/download/${TAG}"
          size_of() {
            # Human-readable size of a built APK, so the table says what a tap will cost.
            local file="dist/star-storyteller-${VERSION}-$1.apk"
            if [ -f "$file" ]; then
              echo "$(( ( $(stat -c%s "$file") + 524288 ) / 1048576 )) MB"
            else
              echo "-"
            fi
          }
          link() { echo "[star-storyteller-${VERSION}-$1.apk](${base}/star-storyteller-${VERSION}-$1.apk)"; }

          {
            echo "## Install"
            echo
            echo "Tap the APK that matches your phone. Almost every Android phone made since 2018"
            echo "is **arm64-v8a**; take the universal APK if you are not sure."
            echo
            echo "| Download | Size | For |"
            echo "| --- | --- | --- |"
            echo "| $(link arm64-v8a) | $(size_of arm64-v8a) | Nearly all modern phones |"
            echo "| $(link universal) | $(size_of universal) | Any phone, larger download |"
            echo "| $(link armeabi-v7a) | $(size_of armeabi-v7a) | Older 32-bit phones |"
            echo "| $(link x86_64) | $(size_of x86_64) | Emulators and x86 tablets |"
            echo
            echo "Android will warn that the app comes from an unknown source; allow installs from"
            echo "your browser or file manager to continue. Checksums:"
            echo "[SHA256SUMS.txt](${base}/SHA256SUMS.txt)."
            echo
            echo "_This repository is private, so the links above need you signed in to GitHub."
            echo "If one does not open, the same files are under **Assets** at the bottom of this"
            echo "release — on the GitHub mobile app, tap **View release details** first._"
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> **Note**: this build is signed with the Android debug key, so it cannot be"
              echo "> installed over a differently signed copy. Uninstall any earlier version first."
              echo
            fi
            echo "## Set it as your assistant"
            echo
            echo "Settings → Apps → Default apps → Digital assistant app → Star Storyteller."
            echo "Then open the app, pick a model from the chip at the top of the chat, and let it"
            echo "download. Web search needs your own SearXNG instance — see the README."
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              echo "Since \`${previous}\`:"
              echo
              git log --no-merges --pretty='- %s' "${previous}..HEAD"
            else
              echo "First release."
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Tag the commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Star Storyteller $TAG"
          git push origin "$TAG"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Star Storyteller ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.version.outputs.name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
