# Publishes a test build to the Releases page on every change to main.
#
# The Releases page is the only practical way to install on a phone with no computer nearby:
# artifacts arrive as .zip files, and a phone cannot open those into an installer. So every change
# that lands on main rebuilds the app and updates a single pre-release, `dev`, in place.
#
# One pre-release rather than one per commit, on purpose. It always sits at the top of the Releases
# page holding the newest build, so there is one place to look and no list of stale test builds to
# scroll past. Numbered releases (v0.2.2 and friends) are cut separately by release.yml and are
# never touched by this workflow.
name: Test build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'
      - '.github/workflows/prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession would otherwise race to move the same tag. Let the newer one win;
# an older build is not worth publishing once a newer commit exists.
concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  prerelease:
    name: Build and publish the test build
    runs-on: ubuntu-latest
    # Shared with keep-signing-key.yml so an empty cache cannot be filled twice at once. A push
    # to main starts the test build and can start a release a minute later; with both minting
    # their own key against one cache name, one save wins and the other ships an APK signed with
    # a key that exists nowhere afterwards. That is how v0.3.1 and the test build before it came
    # to differ. At job level, because this workflow already has a run-level group of its own.
    concurrency:
      group: star-signing-key
      cancel-in-progress: false
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      # Not a secret in any meaningful sense: it protects a keystore that lives only in the
      # Actions cache, never in the repository. What matters is that it is the *same* every run,
      # so a restored keystore can still be opened.
      CI_KEYSTORE_PASSWORD: star-storyteller-ci
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          # Name the build after the release it is heading towards: the newest numbered tag with
          # its patch bumped. `sort -V` on the tag list ignores the `dev` tag, which is not a v-tag.
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -v -- '-' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            major=0; minor=0; patch=1
          else
            core="${latest#v}"
            major="$(echo "$core" | cut -d. -f1)"
            minor="$(echo "$core" | cut -d. -f2)"
            patch="$(( $(echo "$core" | cut -d. -f3) + 1 ))"
          fi
          version="${major}.${minor}.${patch}-dev.${GITHUB_RUN_NUMBER}"

          # versionCode must only ever increase, or Android refuses the install as a downgrade.
          # Both workflows pack the semantic version into the high digits and a build number into
          # the low four, so a numbered release always outranks the test builds leading up to it:
          #   0.2.3-dev.7  -> 203 * 10000 + 7    = 2030007
          #   0.2.3        -> 203 * 10000 + 9999 = 2039999
          #   0.2.4-dev.8  -> 204 * 10000 + 8    = 2040008
          semantic=$(( major * 10000 + minor * 100 + patch ))
          if [ "$GITHUB_RUN_NUMBER" -ge 9999 ]; then
            echo "::error::run number $GITHUB_RUN_NUMBER has caught up with the 9999 reserved for releases"
            exit 1
          fi
          code=$(( semantic * 10000 + GITHUB_RUN_NUMBER ))

          {
            echo "name=$version"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version (versionCode $code)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/src/**/*.gradle.kts', 'Android/src/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Signing, and why it is done this way.
      #
      # Android refuses to install a build over one signed with a different key, so every test
      # build has to be signed with the *same* key as the last one or none of them can be
      # installed as updates.
      #
      # The previous attempt cached ~/.android/debug.keystore and let AGP's debug signing use it.
      # It never once worked: the post-job step reported "Path(s) specified in the action for
      # caching do(es) not exist, hence no cache is being saved" on every run, so nothing was ever
      # stored, every build generated a fresh debug key, and every build refused to install over
      # the one before it. Relying on where another tool happens to put a file was the mistake.
      #
      # So the key is created here, at a path this workflow owns, and handed to Gradle explicitly
      # through STAR_KEYSTORE_PATH. Nothing depends on AGP's debug key any more.
      - name: Restore the CI signing key
        id: signing-cache
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        uses: actions/cache/restore@v4
        with:
          path: ci-keystore
          key: star-ci-signing-key-v2

      - name: Create the CI signing key
        if: ${{ env.KEYSTORE_BASE64 == '' && steps.signing-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p ci-keystore
          keytool -genkeypair -v \
            -keystore ci-keystore/star-ci.jks -storetype PKCS12 -alias star \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$CI_KEYSTORE_PASSWORD" -keypass "$CI_KEYSTORE_PASSWORD" \
            -dname "CN=Lin Test Builds, OU=CI, O=Lin"
        env:
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}

      # Saved only when it was just created; cache/save errors on an existing key.
      - name: Save the CI signing key
        if: ${{ env.KEYSTORE_BASE64 == '' && steps.signing-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ci-keystore
          key: star-ci-signing-key-v2

      - name: Install Android SDK platform 37
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      # One place that decides which key signs this build, so the build steps below do not have to
      # know which of the two situations they are in.
      - name: Work out which key to sign with
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            path="$RUNNER_TEMP/upload.jks"
            password="${{ secrets.KEYSTORE_PASSWORD }}"
            alias="${{ secrets.KEY_ALIAS }}"
            key_password="${{ secrets.KEY_PASSWORD }}"
            kind=upload
          else
            path="$GITHUB_WORKSPACE/ci-keystore/star-ci.jks"
            password="$CI_KEYSTORE_PASSWORD"
            alias=star
            key_password="$CI_KEYSTORE_PASSWORD"
            kind=ci
          fi

          # The certificate this build will be signed with, read from the keystore itself.
          #
          # Not from the APK. The first attempt used `keytool -printcert -jarfile`, which reports
          # nothing for a v2/v3-only APK, and minSdk 31 means there is no v1 signature to read -
          # it would have printed an empty fingerprint and looked fine. The second used apksigner
          # and failed on the runner, because it depended on finding a binary somewhere in the
          # SDK, which is the same kind of assumption that broke signing in the first place.
          #
          # This keystore is created by this workflow, so it is certainly here, and its
          # certificate is exactly the one that ends up in the APK - verified by building an APK
          # and comparing the two.
          fingerprint="$(keytool -list -v -keystore "$path" -alias "$alias" \
            -storepass "$password" 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-Z' 'a-z' || true)"
          if [ -z "$fingerprint" ]; then
            echo "::error::Could not read the signing certificate out of $path"
            exit 1
          fi
          echo "Signing with SHA-256 $fingerprint"

          {
            echo "path=$path"
            echo "password=$password"
            echo "alias=$alias"
            echo "key_password=$key_password"
            echo "kind=$kind"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"
      - name: Read the fingerprint builds have been using
        id: expected
        run: |
          set -euo pipefail
          file=".github/ci-signing-fingerprint.txt"
          if [ -f "$file" ]; then
            echo "fingerprint=$(tr -d '[:space:]' < "$file")" >> "$GITHUB_OUTPUT"
          else
            echo "fingerprint=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the unit tests
        working-directory: ./Android/src
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build the APKs
        working-directory: ./Android/src
        env:
          STAR_VERSION_NAME: ${{ steps.version.outputs.name }}
          STAR_VERSION_CODE: ${{ steps.version.outputs.code }}
          STAR_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STAR_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.password }}
          STAR_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          STAR_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect and rename the APKs
        id: apks
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for apk in Android/src/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/lin-${VERSION}-${abi}.apk"
          done
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No APKs were produced"
            exit 1
          fi
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
          ls -lh dist


      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ env.KEYSTORE_BASE64 != '' }}
          FINGERPRINT: ${{ steps.keystore.outputs.fingerprint }}
          # The key every build so far has used. Compared, not enforced: a changed key still
          # produces an installable APK, it just needs the old one removed first, and saying so is
          # the whole point.
          EXPECTED_FINGERPRINT: ${{ steps.expected.outputs.fingerprint }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/dev"
          size_of() {
            local file="dist/lin-${VERSION}-$1.apk"
            if [ -f "$file" ]; then
              echo "$(( ( $(stat -c%s "$file") + 524288 ) / 1048576 )) MB"
            else
              echo "-"
            fi
          }
          link() { echo "[lin-${VERSION}-$1.apk](${base}/lin-${VERSION}-$1.apk)"; }

          {
            echo "The newest build of \`main\`, rebuilt on every change. **\`${VERSION}\`**, from"
            echo "commit \`${GITHUB_SHA:0:7}\`."
            echo
            echo "## Install"
            echo
            echo "Tap the APK that matches your phone. Almost every Android phone made since 2018"
            echo "is **arm64-v8a**; take the universal APK if you are not sure."
            echo
            echo "| Download | Size | For |"
            echo "| --- | --- | --- |"
            echo "| $(link arm64-v8a) | $(size_of arm64-v8a) | Nearly all modern phones |"
            echo "| $(link universal) | $(size_of universal) | Any phone, larger download |"
            echo "| $(link armeabi-v7a) | $(size_of armeabi-v7a) | Older 32-bit phones |"
            echo "| $(link x86_64) | $(size_of x86_64) | Emulators and x86 tablets |"
            echo
            echo "Checksums: [SHA256SUMS.txt](${base}/SHA256SUMS.txt)."
            echo
            echo "### If Android refuses to install it"
            echo
            echo "**On a Samsung, check Auto Blocker first.** One UI 6.1 and newer ship it turned"
            echo "on, and it blocks installs from outside the Play Store outright while talking"
            echo "about a harmful app - which sends people to Play Protect, where nothing helps."
            echo "Settings, search **Auto Blocker**, turn off **Block app installs from"
            echo "unauthorised sources** (and **App security check** while installing)."
            echo
            echo "**\"Unsafe app blocked\"** is Play Protect, and every sideloaded build gets it -"
            echo "nothing in the APK can prevent it. Tap **More details** then **Install anyway**;"
            echo "the link is small and easy to miss. If it is not offered, turn the check off for"
            echo "the install: Play Store > your profile picture > Play Protect > the gear icon >"
            echo "**Scan apps with Play Protect** off, install, then turn it back on."
            echo
            echo "**\"App not installed\"** is a different thing - see the signing key below."
            echo
            echo "_This repository is private, so the links need you signed in to GitHub. If one"
            echo "does not open, the same files are under **Assets** — on the GitHub mobile app,"
            echo "tap **View release details** first._"
            echo
            # Said first and said loudly when it applies: by the time somebody is reading this
            # they are standing in front of "App not installed" with no idea why, and the answer
            # is not something they could work out from the fingerprint alone.
            if [ -n "${EXPECTED_FINGERPRINT:-}" ] && [ "$EXPECTED_FINGERPRINT" != "$FINGERPRINT" ]; then
              echo "> **This build is signed with a different key than the last one.** Android"
              echo "> will refuse to install it over the copy on your phone: uninstall Star"
              echo "> Storyteller first, and the downloaded models will need fetching again."
              echo "> The test key lives only in the Actions cache and is evicted after a week"
              echo "> without builds. Setting the four signing secrets makes it permanent - see"
              echo "> RELEASING.md."
              echo
            fi
            echo "Signing key: \`${FINGERPRINT}\`."
            if [ "$SIGNED" != "true" ]; then
              echo "This is a CI test key, kept in the Actions cache."
            fi
            echo
            echo "If a build ever refuses to install with \`App not installed\`, compare that"
            echo "fingerprint with the one on the build you have. Android will not install over a"
            echo "differently signed copy, so uninstall first - the models will need downloading"
            echo "again. Setting the four signing secrets makes the key permanent; see"
            echo "RELEASING.md."
            echo
            echo "## What changed"
            echo
            git log --no-merges --pretty='- %s' -n 15 || true
          } > release-notes.md

          cat release-notes.md

      # softprops/action-gh-release creates a missing tag but will not move one that already
      # exists, and this tag has to follow main. Move it here so the release attaches to the
      # commit that was actually built.
      #
      # Through the git data API rather than `git push`. Pushing this ref failed the first time a
      # commit touching .github/workflows landed on main: GitHub refuses a *push* from an App
      # token that carries workflow file changes, and GITHUB_TOKEN has no way to ask for that
      # permission. The APKs had built fine and simply never reached the Releases page - which is
      # the one failure this whole workflow exists to prevent, and it would have come back every
      # time a workflow file changed. Updating the ref through the API is not subject to that
      # check.
      #
      # Never fatal. A test build that exists is worth publishing even against a tag left pointing
      # at an older commit; the notes name the real commit either way. Failing here instead would
      # throw away a finished build over a label.
      - name: Point the dev tag at this commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs"
          code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/tags/dev" \
            -d "{\"sha\":\"${GITHUB_SHA}\",\"force\":true}")"

          # 422 is the tag not existing yet, which is the normal first run.
          if [ "$code" = "422" ] || [ "$code" = "404" ]; then
            code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}" \
              -d "{\"ref\":\"refs/tags/dev\",\"sha\":\"${GITHUB_SHA}\"}")"
          fi

          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::warning::Could not move the dev tag (HTTP $code). Publishing anyway; the notes name the commit."
            cat /tmp/ref.json || true
          else
            echo "dev now points at ${GITHUB_SHA}"
          fi

      # Every push replaces this one rolling release, so the files already attached to it are not
      # history - they are the previous build. Left alone they accumulate: seventy near-identical
      # APKs across eighteen versions, several gigabytes, with the one someone actually wants
      # somewhere in the middle of an alphabetical list. On a phone that is unusable, which is the
      # device this release exists to be installed from.
      - name: Clear the previous build's files
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/releases/tags/dev" --jq '.assets[].id' 2>/dev/null || true)
          for id in $ids; do
            echo "Removing asset $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done

      - name: Publish the test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest test build (${{ steps.version.outputs.name }})
          body_path: release-notes.md
          prerelease: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
