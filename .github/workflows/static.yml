# Publishes the Star Storyteller site to GitHub Pages.
#
# The site is two things:
#   /        the download page, which reads the latest release from the GitHub API at load time,
#            so a new release appears on it without this workflow running again
#   /skills/ the agent skill files, as upstream Edge Gallery published them
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'site/**'
      - 'skills/**'
      - '.github/workflows/static.yml'

  # Refresh the site after a release is published. The page fetches releases client-side, so this
  # is only needed when the page itself changed; it is here so a release never leaves a stale site.
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p staging/skills
          cp -R site/. staging/
          cp -R skills/. staging/skills/
          # Pages runs the output through Jekyll unless told not to, which drops files and
          # directories whose names begin with an underscore.
          touch staging/.nojekyll
          find staging -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run. Without this the action calls "get a Pages site",
          # gets a 404 on a repository where Pages was never switched on, and fails the job.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'staging/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
