syntax = "proto3";

package com.google.ai.edge.gallery.proto;

option java_package = "com.google.ai.edge.gallery.proto";
option java_outer_classname = "MemoryVaultProto";
option java_multiple_files = true;

// What a note is about. Not decoration: the kind decides how long a note stays
// warm and which notes are worth the prompt budget when they compete.
enum NoteKind {
  NOTE_KIND_UNSPECIFIED = 0;

  // Who they are and what does not change: name, where they live, their work.
  NOTE_KIND_IDENTITY = 1;

  // How they like things done - short answers, metric units, no phone calls
  // before ten.
  NOTE_KIND_PREFERENCE = 2;

  // People and how they are reached or referred to.
  NOTE_KIND_RELATIONSHIP = 3;

  // What they do regularly, and when.
  NOTE_KIND_ROUTINE = 4;

  // Something they are working on, which has a beginning and an end.
  NOTE_KIND_PROJECT = 5;

  // Anything else worth carrying between conversations. Cools fastest.
  NOTE_KIND_CONTEXT = 6;
}

// One thing Lin has learned about the user.
message MemoryNote {
  string id = 1;

  // The note in plain language, written as a statement about the user.
  string text = 2;

  NoteKind kind = 3;

  int64 created_at_millis = 4;

  // The last time this was said, implied or acted on. Reinforcement resets the
  // clock, so what keeps coming up keeps being remembered and what stops being
  // true cools off on its own.
  int64 last_confirmed_at_millis = 5;

  // How many separate conversations have confirmed it. A note confirmed many
  // times is worth more of the prompt than one heard once.
  int32 reinforcement_count = 6;

  // The conversations this came from, so any note can be traced back to what
  // was actually said. Capped; the oldest sources fall off first.
  repeated string source_conversation_id = 7;

  // Written by the user rather than inferred by the model. Never cools, and is
  // never rewritten by a later inference.
  bool user_written = 8;

  // Held in warm memory whatever its age, because the user said to.
  bool pinned = 9;

  // Set when the note has cooled out of warm memory. Kept rather than deleted:
  // it is still findable by tool, and being asked about it warms it again.
  bool cold = 10;
}

// What one conversation came to, and where the whole of it can be found.
message ConversationDigest {
  string id = 1;

  // A few words, the way a person would name the conversation later.
  string title = 2;

  int64 started_at_millis = 3;
  int64 ended_at_millis = 4;

  // What was discussed and what came of it, in a short paragraph.
  string summary = 5;

  repeated string topic = 6;

  // The notes this conversation produced or confirmed. This is the link that
  // makes the vault navigable in both directions: from a conversation to what
  // was learned, and from a note back to where it came from.
  repeated string note_id = 7;

  // Relative path of the archived transcript under the archive directory.
  // Empty when the transcript could not be written.
  string archive_path = 8;

  int32 message_count = 9;

  // The model that held the conversation, which is worth knowing when reading
  // an old summary back.
  string model_name = 10;

  // True when the summary was assembled from the transcript rather than
  // written by the model - which is what happens when no model was loaded at
  // the time. Such a digest is a placeholder to be rewritten later, and saying
  // so is what makes the later pass possible.
  bool extractive = 11;
}

// One conversation waiting to be digested.
message PendingDigest {
  string conversation_id = 1;
  int64 queued_at_millis = 2;
  // How many times digesting has been tried and deferred, so a conversation
  // that can never be summarised stops being retried forever.
  int32 attempts = 3;
}

// Everything Lin remembers.
message MemoryVault {
  repeated MemoryNote note = 1;
  repeated ConversationDigest digest = 2;
  repeated PendingDigest pending = 3;

  // When the retention sweep last ran, so it runs once a day rather than on
  // every read.
  int64 last_sweep_at_millis = 4;

  // Whether the facts kept by the old twenty-fact memory have been carried
  // over. One-way, one-time.
  bool migrated_legacy_facts = 5;
}
