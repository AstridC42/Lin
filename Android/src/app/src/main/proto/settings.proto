syntax = "proto3";

package com.google.ai.edge.gallery.proto;

import "chat_history.proto";

option java_package = "com.google.ai.edge.gallery.proto";
option java_multiple_files = true;

enum Theme {
  THEME_UNSPECIFIED = 0;

  // Force to use light theme.
  THEME_LIGHT = 1;

  // Force to use dark theme.
  THEME_DARK = 2;

  // Use the system them setting on user's phone.
  THEME_AUTO = 3;
}

message AccessTokenData {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at_ms = 3;
}

message ImportedModel {
  string file_name = 1;
  int64 file_size = 2;

  oneof config {
    LlmConfig llm_config = 3;
  }
  // Only set for models imported from url.
  string url = 4;
}

message LlmConfig {
  repeated string compatible_accelerators = 1;
  int32 default_max_tokens = 2;
  int32 default_topk = 3;
  float default_topp = 4;
  float default_temperature = 5;
  bool support_image = 6;
  bool support_audio = 7;
  bool support_tiny_garden = 8;
  bool support_mobile_actions = 9;
  bool support_thinking = 10;
  bool support_speculative_decoding = 11;
}

message Settings {
  Theme theme = 1;
  AccessTokenData access_token_data = 2;  // deprecated
  repeated string text_input_history = 3;
  repeated ImportedModel imported_model = 4;
  // Has the app tos been accepted.
  bool is_tos_accepted = 5;
  bool has_run_tiny_garden = 6;
  bool has_seen_benchmark_comparison_help = 7;
  // Has the Gemma terms of use been accepted.
  bool is_gemma_terms_accepted = 8;

  repeated string viewed_promo_id = 10;
  bool disable_firebase_analytics = 11;

  // Star Storyteller: connection settings for a self-hosted SearXNG instance
  // used by the assistant's web_search / open_web_page tools.
  WebSearchSettings web_search_settings = 12;

  // Star Storyteller: assistant preferences (last used mode, spoken replies...).
  AssistantSettings assistant_settings = 13;

  // Star Storyteller: reminders the assistant delivers itself.
  Reminders reminders = 14;

  // Star Storyteller: Home Assistant connection for smart home control.
  SmartHomeSettings smart_home_settings = 15;
}

// Connection settings for a SearXNG metasearch instance.
message WebSearchSettings {
  // Base URL of the SearXNG instance, e.g. "https://searx.example.org".
  // Web search is only offered to the model when this is non-empty and
  // `enabled` is true.
  string instance_url = 1;

  bool enabled = 2;

  // UI language passed to SearXNG ("auto" when empty).
  string language = 3;

  // SearXNG safesearch level: 0 = off, 1 = moderate, 2 = strict.
  int32 safe_search = 4;

  // How many results are handed back to the model per search.
  int32 max_results = 5;

  // Comma separated SearXNG categories, e.g. "general,news".
  string categories = 6;

  // Network timeout for a single request, in seconds.
  int32 timeout_seconds = 7;

  // Optional value for an `Authorization` header, for instances behind a
  // reverse proxy that requires one.
  string auth_header = 8;

  // Whether the assistant may download and read a result page in full.
  bool allow_page_fetch = 9;
}

// Preferences for the unified assistant screen.
message AssistantSettings {
  // Id of the last selected AssistantMode.
  string mode_id = 1;

  // Whether replies are read out loud with text-to-speech.
  bool speak_replies = 2;

  // Whether the assistant may start a call itself (ACTION_CALL) instead of
  // only pre-filling the dialer (ACTION_DIAL).
  bool allow_direct_calls = 3;

  // Name of the model last used on the assistant screen, so the screen can
  // restore it on the next launch.
  string last_model_name = 4;

  // Name of a model whose load was started but never finished.
  //
  // Written just before the assistant asks for a model to be loaded and
  // cleared once loading ends, either way. A launch that finds this already
  // set therefore knows the previous launch died while loading that model -
  // which a crash handler cannot detect, because loading a model too large
  // for the device is killed by the kernel rather than raised as an
  // exception. Since the assistant is the app's first screen and loads the
  // remembered model on sight, that would otherwise repeat on every launch
  // and leave the app permanently unopenable.
  string loading_model_name = 5;

  // Set when the user has been warned that the remembered model may not fit
  // in this device's memory and has chosen to load it anyway, so the warning
  // is not repeated on every launch.
  bool memory_warning_accepted = 6;

  // Whether the always-listening wake word service may run.
  //
  // Off unless the user turns it on. It holds the microphone open for as long
  // as it runs, which is a real cost in battery and a real privacy decision,
  // and neither is something to enable on someone's behalf.
  bool wake_word_enabled = 7;

  // The phrase that summons the assistant. Empty means the default.
  string wake_word_phrase = 8;

  // Name of the text-to-speech voice replies are read in, as reported by the
  // platform engine. Empty means whatever the engine picks for the current
  // language, which is what happened before a voice could be chosen.
  //
  // Stored by name rather than by index: the list a device reports is not
  // stable across engine updates or a change of installed language packs, so
  // an index saved today can be a different voice tomorrow.
  string tts_voice_name = 9;

  // Speaking rate, as a multiplier. 0 means the engine default (1.0).
  float tts_speech_rate = 10;

  // Pitch, as a multiplier. 0 means the engine default (1.0).
  float tts_pitch = 11;

  // When set, holding the power button opens the full chat screen instead of
  // the pop-up panel.
  //
  // Phrased as the negative so that the default - an unset proto bool, which
  // is false - is the pop-up. Someone who has just made this their assistant
  // expects it to behave like the one it replaced, and taking over the whole
  // screen to answer "what time is it" is the thing that behaviour is not.
  bool assist_popup_disabled = 12;

  // Package name of the app "play some music" is sent to.
  //
  // Android has no default-music-app setting for an app to read; what exists
  // is a search-and-play intent that several apps answer, which means a
  // chooser every single time unless one is picked here. Empty leaves the
  // choice to the phone.
  string preferred_music_app = 13;

  // Whether to keep the loaded model in memory after the chat is closed.
  //
  // Off by default and not free: the model's memory, often two to four
  // gigabytes, stays claimed for as long as it holds, and an ongoing
  // notification says so. What it buys is the pop-up, the widget, the car and
  // the wake word answering in place instead of apologising and opening the
  // chat, which is most of the difference between an app and an assistant.
  bool keep_model_loaded = 14;
}

// A reminder the assistant will deliver at a set time.
//
// The assistant's own, not the clock app's: an alarm handed to the clock app
// is the clock app's from then on and cannot be listed, changed or cancelled
// by asking. These can.
message Reminder {
  // Stable id, used to cancel or reschedule.
  string id = 1;

  // What to say when it fires.
  string text = 2;

  // When to fire, as epoch milliseconds.
  int64 due_at_millis = 3;

  // Set once delivered, so a reboot does not resurrect it.
  bool delivered = 4;
}

// Connection settings for a Home Assistant instance.
message SmartHomeSettings {
  // Base URL, e.g. "http://homeassistant.local:8123".
  string base_url = 1;

  // A long-lived access token, created in Home Assistant under the user
  // profile. Home Assistant issues these specifically for this purpose.
  string access_token = 2;

  bool enabled = 3;

  // Network timeout for a single request, in seconds.
  int32 timeout_seconds = 4;
}

message Reminders {
  repeated Reminder reminder = 1;
}

message McpAuth {
  message RequestHeader {
    string header_name = 1;
    string header_value = 2;
  }

  message OAuth {}

  oneof auth_method {
    bool none = 1;
    RequestHeader request_header = 2;
    OAuth oauth = 3;
  }
}

message UserData {
  AccessTokenData access_token_data = 1;
  map<string, string> secrets = 2;
  repeated ChatSessionProto chat_sessions = 3;
  // MCP server URL to MCP auth data.
  map<string, McpAuth> mcp_auths = 4;
}

enum FillMode {
  FILL_MODE_UNSPECIFIED = 0;
  FILL_MODE_DISABLED = 1;
  FILL_MODE_SOLID = 2;
  FILL_MODE_COLORIZE = 3;
}

message Point {
  float x = 1;
  float y = 2;
}

message StrokePath {
  repeated Point point = 1;
  int32 brush_color = 2;
  float brush_size = 3;
  float brush_softness = 4;
  int32 blur_type = 5;
}

// A single cutout, used in scrapbook demo.
message Cutout {
  // id of the cutout.
  string id = 1;

  // Rotation degree applied to the cutout.
  int32 rotation_degree = 2;

  // The width of the border.
  int32 border_width = 3;

  // The color of the border.
  int32 border_color = 4;

  // The fill color.
  int32 fill_color = 5;

  // The fill mode.
  FillMode fill_mode = 6;

  // Doodle stroke paths.
  repeated StrokePath doodle_stroke = 7;
}

// A collection of cutout, used in scrapbook demo.
message CutoutCollection {
  repeated Cutout cutout = 1;
}
